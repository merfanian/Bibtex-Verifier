<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Glimpse mark: a paper page, one citation highlighted, seen through a lens. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <clipPath id="lens-clip"><circle cx="80" cy="78" r="20"/></clipPath>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shine)"/>

  <!-- page with folded corner -->
  <path d="M32 26 h36 l18 18 v52 a8 8 0 0 1 -8 8 h-46 a8 8 0 0 1 -8 -8 v-62 a8 8 0 0 1 8 -8 z" fill="url(#page)"/>
  <path d="M68 26 v12 a6 6 0 0 0 6 6 h12 z" fill="#A5B4FC"/>
  <!-- text lines -->
  <rect x="34" y="52" width="30" height="5" rx="2.5" fill="#A5B4FC"/>
  <rect x="34" y="64" width="22" height="5" rx="2.5" fill="#A5B4FC"/>
  <rect x="34" y="76" width="26" height="5" rx="2.5" fill="#A5B4FC"/>
  <rect x="34" y="88" width="18" height="5" rx="2.5" fill="#A5B4FC"/>

  <!-- lens: magnified, highlighted citation -->
  <circle cx="80" cy="78" r="20" fill="#FFFFFF"/>
  <g clip-path="url(#lens-clip)">
    <rect x="62" y="72" width="36" height="12" rx="6" fill="#FBBF24"/>
    <rect x="66" y="76" width="14" height="4" rx="2" fill="#B45309"/>
  </g>
  <!-- outlined ring + handle: readable on both the white page and the dark tile -->
  <path d="M95 93 L108 106" stroke="#1E1B4B" stroke-width="15" stroke-linecap="round"/>
  <circle cx="80" cy="78" r="20" fill="none" stroke="#1E1B4B" stroke-width="11"/>
  <path d="M95 93 L108 106" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <circle cx="80" cy="78" r="20" fill="none" stroke="#FFFFFF" stroke-width="5"/>
</svg>
